[pytest]
testpaths = tests
# QT_QPA_PLATFORM=offscreen is set in tests/conftest.py so the suite runs
# headless over SSH / in CI without a display.
filterwarnings =
    # QMouseEvent's QPointF ctor is deprecated in favour of QPoint; harmless here.
    ignore:Function:DeprecationWarning
addopts = -q --strict-markers
markers =
    slow: tests that take more than a second
